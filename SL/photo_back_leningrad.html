<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Back - Lundeen's Note</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dawning+of+a+New+Day&family=Reenie+Beanie&family=Homemade+Apple&display=swap');
        
        body {
            margin: 0;
            padding: 40px;
            background: #2a2a2a;
            font-family: 'Reenie Beanie', cursive;
        }
        
        .photo-back-container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .photo-back {
            width: 500px;
            height: 350px;
            background: #ebe6d9;
            position: relative;
            box-shadow: 0 6px 25px rgba(0,0,0,0.6);
            border: 1px solid #c4bfaf;
        }
        
        /* Photo back texture - classic old photo backing */
        .photo-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 2px,
                    rgba(139, 119, 101, 0.02) 2px,
                    rgba(139, 119, 101, 0.02) 4px
                ),
                radial-gradient(ellipse at 20% 30%, rgba(139, 119, 101, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 119, 101, 0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        
        /* Kodak-style logo area (faded) */
        .logo-area {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 10px;
            color: rgba(42, 42, 42, 0.3);
            font-family: 'Times New Roman', serif;
            font-style: italic;
            letter-spacing: 2px;
        }
        
        /* Handwritten note area */
        .note-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-2deg);
            text-align: center;
            width: 80%;
        }
        
        .handwritten-text {
            font-family: 'Reenie Beanie', cursive;
            font-size: 32px;
            color: #1a1a1a;
            line-height: 1.8;
            position: relative;
        }
        
        .line-one {
            display: block;
            margin-bottom: 8px;
        }
        
        .line-two {
            display: block;
            font-style: italic;
            transform: translateX(-5px);
        }
        
        /* Ink texture */
        .handwritten-text::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(26, 26, 26, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(26, 26, 26, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* Fingerprint smudge */
        .smudge {
            position: absolute;
            width: 40px;
            height: 50px;
            background: radial-gradient(ellipse, rgba(80, 60, 40, 0.12) 0%, rgba(80, 60, 40, 0.05) 40%, transparent 70%);
            bottom: 80px;
            left: 60px;
            transform: rotate(25deg);
            border-radius: 50%;
        }
        
        /* Edge wear */
        .edge-wear {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, rgba(139, 119, 101, 0.15) 0%, transparent 100%);
            top: 0;
            right: 0;
        }
        
        .edge-wear-2 {
            position: absolute;
            width: 25px;
            height: 25px;
            background: linear-gradient(-45deg, rgba(139, 119, 101, 0.12) 0%, transparent 100%);
            bottom: 0;
            left: 0;
        }
        
        /* Label at top */
        .label {
            position: absolute;
            top: -35px;
            left: 0;
            color: #ccc;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="photo-back-container">
        <div class="photo-back">
            <div class="label">FOTOBAKSIDA (1940)</div>
            
            <!-- Edge wear effects -->
            <div class="edge-wear"></div>
            <div class="edge-wear-2"></div>
            
            <!-- Fingerprint smudge -->
            <div class="smudge"></div>
            
            <!-- Handwritten note -->
            <div class="note-area">
                <div class="handwritten-text">
                    <span class="line-one">Leningrad contact</span>
                    <span class="line-two">- K. referens</span>
                </div>
            </div>
            
            <!-- Faded stamp/logo -->
            <div class="logo-area">
                VELOX PAPER
            </div>
        </div>
    </div>
</body>
</html>
