<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyskt Vykort 1939 - Baksida</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Courier+Prime&family=Special+Elite&display=swap');

        body {
            margin: 0;
            padding: 40px;
            background: #4a4a4a;
            font-family: 'Courier Prime', monospace;
        }

        .postcard-container {
            max-width: 600px;
            margin: 20px auto;
        }

        .postcard-back {
            width: 600px;
            height: 400px;
            background: #fdfdf8;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #c9c4b0;
            display: flex;
        }

        /* Paper aging */
        .postcard-back::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 80% 30%, rgba(139, 119, 101, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 70%, rgba(139, 119, 101, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 85%, rgba(139, 119, 101, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        .label {
            position: absolute;
            top: -30px;
            left: 0;
            color: #ccc;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Left side - Message */
        .message-section {
            width: 50%;
            padding: 30px 20px;
            border-right: 1px solid #d4c9b0;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .handwritten-message {
            font-family: 'Crimson Text', serif;
            font-size: 18px;
            color: #1a1a1a;
            font-style: italic;
            line-height: 1.8;
            transform: rotate(-1deg);
            margin-top: 40px;
        }

        .signature {
            text-align: right;
            margin-top: 30px;
            font-size: 22px;
        }

        /* Right side - Address */
        .address-section {
            width: 50%;
            padding: 30px 25px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .postmark {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(139, 69, 19, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transform: rotate(12deg);
            font-size: 11px;
            color: rgba(139, 69, 19, 0.7);
            font-family: 'Special Elite', monospace;
            text-align: center;
            line-height: 1.3;
        }

        .postmark-inner {
            font-weight: bold;
        }

        .postmark-date {
            font-size: 13px;
            font-weight: bold;
            margin-top: 3px;
        }

        .stamp-area {
            position: absolute;
            top: 25px;
            right: 115px;
            width: 60px;
            height: 45px;
            border: 2px dashed #c9c4b0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #8b7765;
            text-align: center;
            line-height: 1.2;
        }

        .address-block {
            margin-top: 120px;
            font-family: 'Special Elite', monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #1a1a1a;
        }

        .address-line {
            margin-bottom: 4px;
        }

        .recipient-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .postcard-back {
                width: 100%;
                height: auto;
                min-height: 400px;
                flex-direction: column;
            }

            .message-section,
            .address-section {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #d4c9b0;
            }

            .address-section {
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <div class="postcard-container">
        <div class="postcard-back">
            <div class="label">BAKSIDA</div>

            <!-- Left side - Message -->
            <div class="message-section">
                <div class="handwritten-message">
                    Das Paket kommt wie besprochen.<br>
                    Bitte vorsichtig behandeln.
                    <div class="signature">- R</div>
                </div>
            </div>

            <!-- Right side - Address -->
            <div class="address-section">
                <!-- Postmark -->
                <div class="postmark">
                    <div class="postmark-inner">FRANKFURT</div>
                    <div class="postmark-date">15.6.39</div>
                </div>

                <!-- Stamp area -->
                <div class="stamp-area">
                    BRIEFMARKE
                </div>

                <!-- Address -->
                <div class="address-block">
                    <div class="recipient-name address-line">Senator Ernest Lundeen</div>
                    <div class="address-line">Senate Office Building</div>
                    <div class="address-line">Washington D.C.</div>
                    <div class="address-line">United States of America</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
