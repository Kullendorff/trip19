<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Klaus Reinhardt - Visitkort</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
        
        body {
            margin: 0;
            padding: 40px;
            background: #4a4a4a;
            font-family: 'EB Garamond', serif;
        }
        
        .card-container {
            max-width: 350px;
            margin: 20px auto;
        }
        
        .card-container:nth-child(2) {
            margin-top: 60px;
        }
        
        .business-card {
            width: 350px;
            height: 220px;
            background: #fdfdf8;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #c9c4b0;
        }
        
        /* Paper aging */
        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 80% 30%, rgba(139, 119, 101, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 70%, rgba(139, 119, 101, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .label {
            position: absolute;
            top: -30px;
            left: 0;
            color: #ccc;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* FRONT SIDE */
        .card-front {
            padding: 20px 25px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        
        .card-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }
        
        .decorative-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, #8b7355 0%, #8b7355 30%, transparent 100%);
            margin: 6px 0 10px 0;
        }
        
        .card-title {
            font-size: 14px;
            font-style: italic;
            color: #2a2a2a;
            margin-bottom: 12px;
        }
        
        .card-clinic {
            font-size: 13px;
            line-height: 1.5;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .card-address {
            font-size: 11px;
            line-height: 1.6;
            color: #3a3a3a;
            margin-bottom: 8px;
        }
        
        .card-phone {
            font-size: 11px;
            color: #3a3a3a;
        }
        
        /* BACK SIDE */
        .card-back {
            padding: 25px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .handwritten-note {
            font-family: 'Crimson Text', serif;
            font-size: 22px;
            color: #1a1a1a;
            font-style: italic;
            transform: rotate(-3deg);
            text-align: center;
            letter-spacing: 1px;
        }
        
        /* Subtle ink bleeding effect */
        .handwritten-note::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 50%, rgba(26, 26, 26, 0.02) 0%, transparent 70%);
        }
    </style>
</head>
<body>
    <!-- Front of card -->
    <div class="card-container">
        <div class="business-card">
            <div class="label">FRONT</div>
            <div class="card-front">
                <div class="card-name">Dr. Klaus Reinhardt</div>
                <div class="decorative-line"></div>
                <div class="card-title">Direktor</div>
                <div class="card-clinic">Frankfurt Klinik für<br>Neuropsychiatrie</div>
                <div class="card-address">
                    Dorfstraße 42c<br>
                    15230 Frankfurt (Oder)-Güldendorf<br>
                    Brandenburg, Deutschland
                </div>
                <div class="card-phone">Tel: Frankfurt 4-7829</div>
            </div>
        </div>
    </div>
    
    <!-- Back of card -->
    <div class="card-container">
        <div class="business-card">
            <div class="label">BACK</div>
            <div class="card-back">
                <div class="handwritten-note">
                    Kalenko - 1942
                </div>
            </div>
        </div>
    </div>
</body>
</html>
